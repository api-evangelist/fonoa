specification: API Commons Plans
specificationVersion: '0.1'
provider: Fonoa
providerId: fonoa
created: '2026-06-12'
modified: '2026-06-12'
reconciled: true
description: >
  Fonoa's pricing is enterprise-focused and commitment-based. There is no self-serve
  free tier; all plans require contacting Fonoa's sales team. Pricing is structured
  around a base commitment fee with per-document and per-organization overage charges.
  Fonoa targets mid-market to large enterprises with significant global tax compliance needs.
plans:
  - name: Enterprise
    description: >
      Full-platform access for enterprise customers requiring global indirect tax automation.
      Commitment-based pricing with a multi-year contract term. Includes access to all APIs:
      Validate, Tax Engine, E-Invoicing, Onboarding, and Webhooks. Additional organizations
      and documents billed at overage rates.
    type: enterprise
    url: https://www.fonoa.com
    entries:
      - name: Base Commitment
        description: Annual or multi-year platform access fee, negotiated per customer
        type: boolean
        quota: false
        metered: false
        value: true
        notes: Commitment fee not publicly disclosed; industry estimates range from EUR 2,000 to EUR 10,000 per month
      - name: Additional Organizations
        description: Per-organization overage charge beyond base commitment
        type: metered
        quota: false
        metered: true
        unit: organization
        notes: Charged per additional organization beyond included allotment
      - name: Additional Documents
        description: Per-document fee for e-invoicing and transaction submissions beyond commitment
        type: metered
        quota: false
        metered: true
        unit: document
        price: 0.30
        currency: EUR
        notes: EUR 0.30 per additional document beyond included commitment volume
      - name: All APIs Included
        description: Access to Validate, Tax Engine, E-Invoicing, Onboarding, and Webhooks APIs
        type: boolean
        quota: false
        metered: false
        value: true
      - name: Sandbox Environment
        description: Access to sandbox environment for integration testing
        type: boolean
        quota: false
        metered: false
        value: true
      - name: Demo Environment
        description: Access to demo environment for pre-sales and development
        type: boolean
        quota: false
        metered: false
        value: true
      - name: Support
        description: Dedicated enterprise support and onboarding assistance
        type: boolean
        quota: false
        metered: false
        value: true
